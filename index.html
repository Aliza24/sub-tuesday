<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Table Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="table-container">
    <h2>Multiplication Grid (2x to 10x)</h2>
    <table>
        <thead>
            <tr>
                <th>Expression</th>
                <th>Result</th>
                <th>Expression</th>
                <th>Result</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="equation">2 × 1</td>
                <td class="product">2</td>
                <td class="equation">2 × 6</td>
                <td class="product">12</td>
            </tr>
            <tr class="highlight-row">
                <td class="equation">2 × 2</td>
                <td class="product font-bold">4</td>
                <td class="equation">2 × 7</td>
                <td class="product">14</td>
            </tr>
            <tr>
                <td class="equation">2 × 3</td>
                <td class="product">6</td>
                <td class="equation">2 × 8</td>
                <td class="product">16</td>
            </tr>
            <tr>
                <td class="equation">2 × 4</td>
                <td class="product">8</td>
                <td class="equation">2 × 9</td>
                <td class="product">18</td>
            </tr>
            <tr>
                <td class="equation">2 × 5</td>
                <td class="product">10</td>
                <td class="equation">2 × 10</td>
                <td class="product">20</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
